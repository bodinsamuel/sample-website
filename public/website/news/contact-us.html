<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Fake News</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #333;
      color: white;
      padding: 10px 0;
      text-align: center;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
    }

    nav ul li {
      margin: 0 15px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .container {
      width: 90%;
      margin: auto;
      overflow: hidden;
    }

    .featured-news {
      display: flex;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .news-item {
      background-color: white;
      margin: 10px;
      padding: 20px;
      flex: 1 1 calc(33.333% - 40px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    }

    .news-item img {
      max-width: 100%;
      height: auto;
    }

    .news-item h2 {
      font-size: 20px;
      margin: 10px 0;
    }

    .news-item p {
      font-size: 16px;
    }

    .categories {
      margin: 30px 0;
    }

    .categories h2 {
      text-align: center;
    }

    .categories ul {
      display: flex;
      justify-content: center;
      list-style: none;
      padding: 0;
    }

    .categories ul li {
      margin: 0 10px;
      padding: 10px 20px;
      background-color: #333;
      color: white;
      border-radius: 5px;
    }

    .categories ul li a {
      color: white;
      text-decoration: none;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px 0;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .news-item {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Fake News</h1>
    <nav>
      <ul>
        <li><a href="/website/news/">Home</a></li>
        <li><a href="/website/news/">World</a></li>
        <li><a href="/website/news/">Politics</a></li>
        <li><a href="/website/news/">Business</a></li>
        <li><a href="/website/news/">Technology</a></li>
        <li><a href="/website/news/">Sports</a></li>
        <li><a href="/website/news/">Entertainment</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <h2>Contact Us</h2>

    <p>Empty page</p>
  </div>

  <footer>
    <p>© 2024 Fake News. All Rights Reserved.</p>
    <a href="/website/news/contact-us.html">Contact US</a>
    <a href="/website/news/404.html">404</a>
    <a href="/website/news/no_index.html">Not Indexable</a>
  </footer>

</body>

</html>
